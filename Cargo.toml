[package]
name = "simple-ssh-tui-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
crossterm = "0.29.0"
dirs = "6.0.0"
ratatui = "0.30.0"
serde = "1.0.228"
beautiful_log = { git = "https://github.com/Reisenthaler/beautiful_log" }
tracing = "0.1.44"
portable-pty = "0.9.0"

[profile.release]
panic = "abort"          # eliminates unwinding tables → smaller binary
codegen-units = 1        # allows more inlining & cross‑crate optimisation
lto = true               # link‑time optimisation → drops dead code
strip = true             # removes symbol tables (same as `strip` command)
opt-level = 3            # (default) maximum speed optimisation
